<!DOCTYPE html>
<!-- last updated: 30/04/2026 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rally Portugal 2026 - v3 — Meteo Admin</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #111;
  --card-bg:   #1a1a1a;
  --accent:    #e8c840;
  --subtext:   #888;
  --border:    #2a2a2a;
  --radius:    10px;
  --toolbar-h: 36px;
  --brand-h:   38px;
}

html, body {
  height: 100dvh;
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Branding strip ──────────────────────────────────────────────────────── */
#brand-strip {
  height: var(--brand-h);
  min-height: var(--brand-h);
  background: #000;
  border-bottom: 1px solid #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  flex-shrink: 0;
}
#brand-strip img { height: 26px; width: auto; display: block; opacity: 0.9; }

/* ── Toolbar ─────────────────────────────────────────────────────────────── */
#toolbar {
  height: var(--toolbar-h);
  min-height: var(--toolbar-h);
  display: flex;
  align-items: center;
  padding: 0 6px 0 2px;
  background: #000;
  border-bottom: 1px solid #222;
  gap: 6px;
  flex-shrink: 0;
  position: relative;
}

#btn-launch {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: none; background: transparent;
  color: #fff; cursor: pointer; flex-shrink: 0;
}
#btn-launch:active { background: rgba(255,255,255,0.12); }
#btn-launch svg {
  width: 22px; height: 22px;
  fill: none; stroke: currentColor;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}

#toolbar-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--accent);
  flex: 1;
}

#toolbar-count {
  font-size: 12px;
  color: var(--subtext);
  padding-right: 4px;
}

/* ── Countdown bar ───────────────────────────────────────────────────────── */
#countdown-bar-wrap {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 0 0 2px 2px;
  overflow: hidden; pointer-events: none;
}
#countdown-bar {
  height: 100%; width: 100%;
  background: var(--accent);
  border-radius: 0 0 2px 2px;
  transform-origin: left center;
  animation: countdown 60s linear forwards;
}
@keyframes countdown {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0); }
}

/* ── Scroll ──────────────────────────────────────────────────────────────── */
#scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  min-height: 0;
}

/* ── Notes grid ──────────────────────────────────────────────────────────── */
#cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* ── Note cards ──────────────────────────────────────────────────────────── */
.note-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  height: 160px;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}
.note-card:active { opacity: 0.85; }

/* Type label strip — always at top */
.note-type-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 5px 8px 3px;
  flex-shrink: 0;
  background: var(--card-bg);
}

/* Video / image thumbnail */
.note-thumb {
  width: 100%;
  flex: 1;
  min-height: 0;
  object-fit: contain;
  display: block;
  background: #000;
}

/* Card text area */
.note-text-area {
  padding: 4px 8px 6px;
  flex-shrink: 0;
  height: 52px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.note-body {
  font-size: 11px;
  line-height: 1.4;
  color: #ddd;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  flex: 1;
  white-space: pre-wrap;
}

/* Text-only card — no thumbnail, label + body fills full card */
.note-card.text-only .note-text-area {
  height: auto;
  flex: 1;
  padding: 4px 8px 8px;
}
.note-card.text-only .note-body {
  -webkit-line-clamp: 6;
  font-size: 12px;
}

/* ── File cards (PDF / image / txt from folder) ──────────────────────────── */
.file-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 10px 12px;
  gap: 12px;
  grid-column: span 3;  /* full width */
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  color: inherit;
}
.file-card:active { background: #222; }
.file-card-icon {
  flex-shrink: 0;
  width: 32px; height: 32px;
  color: var(--accent);
}
.file-card-icon svg {
  width: 100%; height: 100%;
  fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.file-card-info { flex: 1; min-width: 0; }
.file-card-name {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-card-meta {
  font-size: 11px;
  color: var(--subtext);
  margin-top: 2px;
}
.file-card-arrow {
  flex-shrink: 0;
  color: var(--subtext);
  width: 20px; height: 20px;
}
.file-card-arrow svg {
  width: 100%; height: 100%;
  fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ── Text expand modal ───────────────────────────────────────────────────── */
#text-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#text-modal.visible { display: flex; }
#text-modal-box {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 20px;
  max-width: 480px;
  width: 100%;
  max-height: 70vh;
  overflow-y: auto;
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* ── Image overlay ───────────────────────────────────────────────────────── */
#img-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.92);
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#img-overlay.visible { display: flex; }
#img-overlay img {
  max-width: 96%; max-height: 96%;
  object-fit: contain;
  border-radius: 6px;
}

/* ── Empty state ─────────────────────────────────────────────────────────── */
#empty {
  display: none;
  text-align: center;
  color: var(--subtext);
  font-size: 14px;
  margin-top: 40px;
}

/* ── Toast ───────────────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 40px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(232,200,64,0.95);
  color: #000; font-size: 13px; font-weight: 700;
  padding: 8px 18px; border-radius: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  white-space: nowrap; z-index: 50;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


/* ── Cached version banner ───────────────────────────────────────────────── */
#cached-banner {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  background: #b35c00;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-align: center;
  padding: 6px 12px;
  text-transform: uppercase;
}
#cached-banner.visible { display: block; }
</style>
</head>
<body>

<div id="cached-banner">⚠ Showing cached version — data may not be current</div>

<div id="brand-strip">
  <img src="../../msport_logo.png" alt="M-Sport">
  <img src="../../stagehand_logo.png" alt="StageHand">
</div>

<div id="toolbar">
  <div id="countdown-bar-wrap"><div id="countdown-bar"></div></div>
  <button id="btn-launch" aria-label="Back to rally">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div id="toolbar-title">Rally Portugal 2026 - v3 — Meteo Admin</div>
  <div id="toolbar-count"></div>
</div>

<div id="scroll">
  <div id="cards"></div>
  <div id="empty">No meteo admin items uploaded yet.</div>
</div>

<div id="img-overlay">
  <img id="overlay-img" src="" alt="">
</div>

<div id="text-modal">
  <div id="text-modal-box"></div>
</div>

<div id="toast"></div>

<script>

// ── GitHub token ──────────────────────────────────────────────────────────
(function() {
  const hash = window.location.hash;
  const match = hash.match(/[#&]t=([^&]+)/);
  if (match) {
    localStorage.setItem('gh_token', match[1]);
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
})();
function _ghToken() { return localStorage.getItem('gh_token') || ''; }
function _ghHeaders() {
  const t = _ghToken();
  const h = { 'Accept': 'application/vnd.github.v3+json' };
  if (t) h['Authorization'] = 'token ' + t;
  return h;
}

const GITHUB_USERNAME = "msrt-wrc-met-rep-pho";
const GITHUB_REPO     = "a7f3e291-4b8d-4c2a-9e16-d05f8b3c1a47";
const RALLY_FOLDER    = "afe9-48-42-91-d58314_D";
// ── Stats logging ──────────────────────────────────────────────────────────
(function() {
  function _deviceId() {
    let id = localStorage.getItem('sh_device_id');
    if (!id) {
      id = 'dev_' + Math.random().toString(36).slice(2,10) +
           Math.random().toString(36).slice(2,10);
      localStorage.setItem('sh_device_id', id);
    }
    return id;
  }
  window._logEvent = function(eventType, extra) {
    const endpoint = 'https://script.google.com/macros/s/AKfycbxOdSGTatWXmHs08MM87G-_unEzaOiOAjTcuxewKW3LMbIxITZiJ9lWCmYmy3UEYnxw/exec';
    const token    = 'sh-x7k2-rally-statsh-x7k2-rally-stat';
    if (!endpoint) return;
    try {
      const entry = Object.assign({
        action: 'log', token, t: new Date().toISOString(),
        ev: eventType, d: _deviceId(),
        rally: RALLY_FOLDER, rally_name: 'Rally Portugal 2026 - v3',
      }, extra || {});
      const formBody = Object.entries(entry).map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
      fetch(endpoint, { method: 'POST', body: formBody,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      }).catch(()=>{});
    } catch(e) {}
  };
})();

// ── Mark as seen ──────────────────────────────────────────────────────────
function _markSeen(count) {
  localStorage.setItem(`seen_${RALLY_FOLDER}_meteo_admin`, count);
}

// Meteo admin data injected at upload time
const NOTES_DATA = [
  {
    "type": "file",
    "subtype": "pdf",
    "filename": "POR26 - Itinerary V1.0 - 4.3.2026.pdf",
    "size_kb": 885.2,
    "uploaded_at": "21:09:41"
  },
  {
    "type": "text",
    "text": "Don't forget to come to SP Fri night",
    "created_at": "21:26:14"
  }
];

// Base URL for repo-hosted images
function _imgUrl(filename) {
  return `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${RALLY_FOLDER}/${filename}`;
}
function _fileUrl(filename) {
  return `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${RALLY_FOLDER}/${filename}`;
}
function _pdfIcon() {
  return `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>`;
}
function _imgFileIcon() {
  return `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
}
function _txtIcon() {
  return `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/><line x1="9" y1="9" x2="10" y2="9"/></svg>`;
}

// ── Image overlay ─────────────────────────────────────────────────────────
const overlay    = document.getElementById('img-overlay');
const overlayImg = document.getElementById('overlay-img');
overlay.addEventListener('click', () => overlay.classList.remove('visible'));

function _showOverlay(src) {
  overlayImg.src = src;
  overlay.classList.add('visible');
}

// ── Text modal ────────────────────────────────────────────────────────────
const textModal    = document.getElementById('text-modal');
const textModalBox = document.getElementById('text-modal-box');
textModal.addEventListener('click', () => textModal.classList.remove('visible'));

function _showTextModal(text) {
  textModalBox.textContent = text;
  textModal.classList.add('visible');
}

// ── Build cards ───────────────────────────────────────────────────────────
const cardsEl = document.getElementById('cards');
let knownCount = 0;

function renderAll(data) {
  cardsEl.innerHTML = '';
  if (!data || data.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('toolbar-count').textContent = '';
    knownCount = 0;
    return;
  }
  document.getElementById('empty').style.display = 'none';
  document.getElementById('toolbar-count').textContent =
    `${data.length} item${data.length > 1 ? 's' : ''}`;

  data.forEach(note => {
    const card = document.createElement('div');

    function _typeLabel(text) {
      const el = document.createElement('div');
      el.className = 'note-type-label';
      el.textContent = text;
      return el;
    }
    function _textArea(text, clamp) {
      const area = document.createElement('div');
      area.className = 'note-text-area';
      const body = document.createElement('div');
      body.className = 'note-body';
      if (clamp) body.style.webkitLineClamp = clamp;
      body.textContent = text || '';
      area.appendChild(body);
      return area;
    }

    if (note.type === 'video') {
      card.className = 'note-card';
      card.appendChild(_typeLabel('Video'));
      const thumb = document.createElement('img');
      thumb.className = 'note-thumb';
      thumb.src = note.thumbnail;
      thumb.alt = 'Video thumbnail';
      card.appendChild(thumb);
      card.appendChild(_textArea(note.text));
      card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'video'}); window.open(note.url, '_blank'); });

    } else if (note.type === 'image') {
      card.className = 'note-card';
      card.appendChild(_typeLabel('Image'));
      const src = _imgUrl(note.filename);
      const img = document.createElement('img');
      img.className = 'note-thumb';
      img.src = src;
      img.alt = note.text || '';
      card.appendChild(img);
      card.appendChild(_textArea(note.text));
      card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'image'}); _showOverlay(src); });

    } else if (note.type === 'text') {
      card.className = 'note-card text-only';
      card.appendChild(_typeLabel('Note'));
      card.appendChild(_textArea(note.text, 6));
      card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'text'}); _showTextModal(note.text); });

    } else if (note.type === 'file') {
      // File cards span full width
      card.className = 'file-card';
      const iconDiv = document.createElement('div');
      iconDiv.className = 'file-card-icon';
      const infoDiv = document.createElement('div');
      infoDiv.className = 'file-card-info';
      const nameDiv = document.createElement('div');
      nameDiv.className = 'file-card-name';
      nameDiv.textContent = note.filename;
      const metaDiv = document.createElement('div');
      metaDiv.className = 'file-card-meta';
      metaDiv.textContent = `${note.size_kb} KB · Uploaded ${note.uploaded_at}`;
      infoDiv.appendChild(nameDiv);
      infoDiv.appendChild(metaDiv);
      const arrowDiv = document.createElement('div');
      arrowDiv.className = 'file-card-arrow';
      arrowDiv.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`;

      if (note.subtype === 'image') {
        iconDiv.innerHTML = _imgFileIcon();
        const src = _fileUrl(note.filename);
        card.appendChild(iconDiv); card.appendChild(infoDiv); card.appendChild(arrowDiv);
        card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'file', sub: 'image'}); _showOverlay(src); });

      } else if (note.subtype === 'pdf') {
        iconDiv.innerHTML = _pdfIcon();
        const url = _fileUrl(note.filename);
        card.appendChild(iconDiv); card.appendChild(infoDiv); card.appendChild(arrowDiv);
        card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'file', sub: 'pdf'}); window.open(url, '_blank'); });

      } else if (note.subtype === 'text') {
        iconDiv.innerHTML = _txtIcon();
        card.appendChild(iconDiv); card.appendChild(infoDiv); card.appendChild(arrowDiv);
        card.addEventListener('click', () => { if (window._logEvent) _logEvent('meteo_admin_tap', {type: 'file', sub: 'text'}); _showTextModal(note.text || ''); });
      }
    }

    cardsEl.appendChild(card);
  });

  knownCount = data.length;
  _markSeen(data.length);
}

renderAll(NOTES_DATA);
if (window._logEvent) _logEvent('meteo_admin_open', {});

// ── Back to launch ────────────────────────────────────────────────────────
document.getElementById('btn-launch').addEventListener('click', () => {
  window.location.href = 'launch.html';
});

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Countdown bar ─────────────────────────────────────────────────────────
function resetCountdownBar() {
  const bar = document.getElementById('countdown-bar');
  bar.style.animation = 'none';
  bar.offsetHeight;
  bar.style.animation = '';
}

// ── Live refresh ──────────────────────────────────────────────────────────
const _apiBase = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${RALLY_FOLDER}/meteo_admin.json`;

async function checkForUpdates() {
  if (document.hidden) { resetCountdownBar(); return; }
  try {
    const r = await fetch(_apiBase, { headers: _ghHeaders() });
    if (!r.ok) { resetCountdownBar(); return; }
    const apiData = await r.json();
    const data = JSON.parse(atob(apiData.content.replace(/\n/g, '')));
    if (data.length > knownCount) {
      const added = data.length - knownCount;
      renderAll(data);
      showToast(`+${added} new item${added > 1 ? 's' : ''}`);
    }
  } catch (e) {}
  resetCountdownBar();
}

resetCountdownBar();
setInterval(checkForUpdates, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkForUpdates();
});



// ── Cached version detection ──────────────────────────────────────────────
(async function() {
  if (!('serviceWorker' in navigator)) return;
  try {
    // Fetch the current page URL — if SW serves it from cache, 
    // the custom header X-From-SW-Cache will be present
    const resp = await fetch(window.location.href, { method: 'GET', cache: 'no-store' });
    if (resp.headers.get('X-From-SW-Cache') === '1') {
      const banner = document.getElementById('cached-banner');
      if (banner) banner.classList.add('visible');
    }
  } catch (e) {}
})();
// ── Service Worker registration ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' })
    .catch(() => {});
}
</script>
</body>
</html>
